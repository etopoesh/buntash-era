<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бунташный век</title>
<style>
  :root{
    --ink:#3B2A1B;
    --ink-soft:#6B5642;
    --parchment:#EFE3C8;
    --parchment-dark:#E2D3AE;
    --wood:#231B14;
    --wood-2:#2F2318;
    --wood-3:#3A2C1E;
    --seal:#8C2A20;
    --seal-dark:#6E2018;
    --gold:#B8912E;
    --gold-light:#D4B45A;
    --green:#3F5741;
    --green-dark:#2E4030;
    --danger:#8C2A20;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--wood);
    color:var(--ink);
    font-family:Georgia,'Palatino Linotype','Times New Roman',serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184,145,46,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(140,42,32,0.08), transparent 40%);
  }
  .ui{font-family:'Segoe UI',Arial,Helvetica,sans-serif;}
  #app{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}

  .center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .landing-card{
    background:var(--parchment);
    border:1px solid var(--parchment-dark);
    border-radius:6px;
    padding:40px 36px;
    max-width:440px;
    width:100%;
    text-align:center;
    box-shadow:0 0 0 6px var(--wood-2), 0 8px 24px rgba(0,0,0,0.4);
  }
  .crest{
    width:56px;height:56px;margin:0 auto 18px;
    border:2px solid var(--seal);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--seal);font-size:26px;font-weight:bold;
  }
  h1.title{font-size:28px;margin:0 0 6px;letter-spacing:0.5px;color:var(--ink);}
  .subtitle{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;color:var(--ink-soft);margin:0 0 28px;}
  .role-btn{
    display:block;width:100%;padding:14px 18px;margin-bottom:12px;
    font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;
    border-radius:4px;border:1px solid var(--seal);
    background:var(--seal);color:var(--parchment);cursor:pointer;
  }
  .role-btn.secondary{background:transparent;color:var(--seal);}
  .role-btn:active{transform:scale(0.99);}

  input[type=text]{
    width:100%;padding:11px 12px;font-family:'Segoe UI',Arial,sans-serif;font-size:15px;
    border:1px solid var(--parchment-dark);border-radius:4px;background:#FBF6E9;color:var(--ink);
    margin-bottom:10px;
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
  .chip{
    font-family:'Segoe UI',Arial,sans-serif;font-size:13px;padding:7px 13px;border-radius:16px;
    border:1px solid var(--gold);color:var(--gold);background:transparent;cursor:pointer;
  }

  .resource-bar{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;
  }
  .res-pill{
    flex:1;min-width:100px;background:var(--parchment);border:1px solid var(--parchment-dark);
    border-radius:6px;padding:10px 12px;text-align:center;
  }
  .res-pill .val{font-size:22px;font-weight:bold;color:var(--ink);}
  .res-pill .lab{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .rod-header{
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;
    color:var(--parchment);
  }
  .rod-header .name{font-size:22px;}
  .rod-header button{
    font-family:'Segoe UI',Arial,sans-serif;font-size:12px;background:none;border:1px solid var(--parchment-dark);
    color:var(--parchment-dark);padding:5px 10px;border-radius:4px;cursor:pointer;
  }

  .event-card{
    background:var(--parchment);border:1px solid var(--parchment-dark);border-radius:6px;
    padding:24px;margin-bottom:16px;
  }
  .era-badge{
    display:inline-block;font-family:'Segoe UI',Arial,sans-serif;font-size:11px;
    color:var(--ink-soft);margin-bottom:8px;
  }
  .type-badge{
    display:inline-block;font-family:'Segoe UI',Arial,sans-serif;font-size:11px;font-weight:600;
    padding:3px 9px;border-radius:10px;margin-left:8px;vertical-align:middle;
  }
  .type-badge.normal{background:#E3E9DE;color:var(--green-dark);}
  .type-badge.global{background:#F1DCC9;color:var(--seal-dark);}
  .event-title{font-size:22px;margin:0 0 12px;}
  .event-desc{font-size:16px;line-height:1.6;color:var(--ink);margin-bottom:20px;}

  .choice-btn{
    display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;
    font-family:'Segoe UI',Arial,sans-serif;font-size:15px;
    background:#FBF6E9;border:1px solid var(--parchment-dark);border-radius:4px;color:var(--ink);
    cursor:pointer;
  }
  .choice-btn:active{background:var(--parchment-dark);}

  .outcome-box{
    border-left:4px solid var(--seal);background:#F6ECD9;padding:14px 16px;border-radius:0 4px 4px 0;
  }
  .outcome-box .otitle{font-size:17px;font-weight:bold;margin-bottom:6px;color:var(--seal-dark);}
  .outcome-box .otext{font-size:14px;line-height:1.55;margin-bottom:10px;}
  .effect-line{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:600;}
  .effect-line.pos{color:var(--green-dark);}
  .effect-line.neg{color:var(--seal-dark);}

  .waiting-box{
    font-family:'Segoe UI',Arial,sans-serif;text-align:center;padding:24px 12px;color:var(--ink-soft);font-size:14px;
  }

  /* GM view */
  .gm-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;}
  @media (max-width:800px){.gm-grid{grid-template-columns:1fr;}}
  .gm-panel{background:var(--parchment);border:1px solid var(--parchment-dark);border-radius:6px;padding:16px;}
  .gm-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .gm-nav button{
    font-family:'Segoe UI',Arial,sans-serif;background:var(--seal);color:var(--parchment);border:none;
    padding:8px 14px;border-radius:4px;cursor:pointer;font-size:13px;
  }
  .gm-nav button:disabled{opacity:0.35;}
  .gm-nav .pos{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;color:var(--ink-soft);}

  table.summary{width:100%;border-collapse:collapse;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;}
  table.summary th{text-align:left;color:var(--ink-soft);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--parchment-dark);font-size:11px;}
  table.summary td{padding:7px 4px;border-bottom:1px solid var(--parchment-dark);}
  table.summary tr.rod-row{cursor:pointer;}
  table.summary tr.rod-row:active{background:var(--parchment-dark);}

  .history-panel{
    background:#FBF6E9;border:1px solid var(--parchment-dark);border-radius:4px;padding:10px 12px;margin:4px 0 12px;
    font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;
  }
  .history-item{padding:6px 0;border-bottom:1px dashed var(--parchment-dark);}
  .history-item:last-child{border-bottom:none;}
  .history-item .h-event{font-weight:600;color:var(--ink);}
  .history-item .h-choice{color:var(--ink-soft);}
  .history-item .h-status{font-style:italic;color:var(--gold);}

  .vote-row{display:flex;justify-content:space-between;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;padding:5px 0;border-bottom:1px solid var(--parchment-dark);}
  .vote-tally{margin:12px 0;}
  .reveal-btn{
    width:100%;padding:13px;font-family:'Segoe UI',Arial,sans-serif;font-weight:600;font-size:14px;
    background:var(--green);color:var(--parchment);border:none;border-radius:4px;cursor:pointer;margin-top:10px;
  }
  .reveal-btn:disabled{background:#9aa89b;cursor:default;}
  .revealed-note{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;color:var(--green-dark);padding:10px 0;}

  .top-link{
    font-family:'Segoe UI',Arial,sans-serif;font-size:12px;color:var(--gold-light);cursor:pointer;
    display:inline-block;margin-bottom:16px;
  }
  .small-note{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;color:var(--ink-soft);margin-top:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'buntash-state-v1';

function initialState(){
  return {
    currentIndex: 0,
    events: [
      {
        id:'salt',
        type:'normal',
        era:'Царствование Алексея Михайловича, 1646 год',
        title:'Соляные рудники',
        description:'Казна опустела после долгих войн. Боярская дума предлагает поднять налог на соль и вложить средства рода в разработку новых рудников — доход обещают скорый.',
        choices:[
          {key:'invest', label:'Вложиться в рудники и поддержать соляной налог',
            effect:{zoloto:15, krestyane:-10, slava:-5},
            outcomeTitle:'Соляной бунт!',
            outcomeText:'Соль подорожала втрое. В Москве вспыхнул бунт — толпа громила дворы бояр, причастных к новому налогу. Прибыль обернулась разорением и позором.'},
          {key:'refuse', label:'Отказаться от участия, поискать другие источники дохода',
            effect:{zoloto:-5},
            outcomeTitle:'Казна скудеет',
            outcomeText:'Соляной бунт обошёл ваш род стороной — но и прибыли он не принёс. Казна рода недосчиталась дохода.'}
        ]
      },
      {
        id:'war',
        type:'global',
        era:'1654 год, Земский собор',
        title:'Поход на Речь Посполитую',
        description:'Царь созывает роды на Земский собор, чтобы решить судьбоносный вопрос: начинать ли большую войну с Речью Посполитой за освобождение Малороссии. Голос каждого рода будет учтён.',
        choices:[
          {key:'war', label:'Голосовать за войну'},
          {key:'peace', label:'Голосовать за мир и переговоры'}
        ],
        outcomes:{
          war:{
            narrative:'Большинство родов поддержало поход. Война оказалась долгой и разорительной: обозы разграблены, деревни опустели от рекрутских наборов.',
            allEffect:{krestyane:-15, zoloto:-10},
            majorityVoterEffect:{slava:-5}
          },
          peace:{
            narrative:'Большинство родов выступило за мир — царь отказался от похода. Но пока Дума медлила, крымские набеги разорили южные рубежи; вина за промедление легла на тех, кто настаивал на мире.',
            allEffect:{zoloto:-5},
            majorityVoterEffect:{slava:-5}
          }
        }
      },
      {
        id:'copper',
        type:'normal',
        era:'1662 год, денежная реформа',
        title:'Медные деньги',
        description:'Царская казна чеканит медные деньги и приравнивает их по цене к серебряным. Часть казны вашего рода хранится в звонкой монете — что делать с ней?',
        choices:[
          {key:'exchange', label:'Обменять серебро на медные деньги по указу',
            effect:{zoloto:-15, krestyane:-5},
            outcomeTitle:'Медный бунт',
            outcomeText:'Медные деньги стремительно обесценились. В Москве вспыхнул Медный бунт — толпа требовала выдачи виновных бояр. Казна рода понесла тяжёлые потери.'},
          {key:'keep', label:'Припрятать серебро, не поддаваться указу',
            effect:{zoloto:5, slava:-3},
            outcomeTitle:'Осторожность окупилась',
            outcomeText:'Ваш род сохранил богатство — но соседи шептались о том, что род уклонился от общего дела.'}
        ]
      }
    ],
    rods: {}
  };
}

function defaultResources(){ return {slava:10, krestyane:100, zoloto:50}; }

async function loadState(){
  if(!window.storage){
    storageError = 'Хранилище недоступно (window.storage не найдено). Похоже, страница открыта не через окно предпросмотра артефакта Claude — синхронизация между планшетами работать не будет, но игра на этом экране всё равно продолжит работать локально.';
    return state || initialState();
  }
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){ storageError = null; return JSON.parse(res.value); }
  }catch(e){}
  if(state) return state;
  const fresh = initialState();
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(fresh), true); storageError = null; }
  catch(e){ storageError = 'Не удалось сохранить состояние игры: ' + (e && e.message ? e.message : e); }
  return fresh;
}
async function saveState(s){
  if(!window.storage){ return; }
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(s), true); storageError = null; }
  catch(e){ storageError = 'Не удалось сохранить ход: ' + (e && e.message ? e.message : e); console.error(e); }
}

let state = null;
let role = null;
let currentRod = null;
let pollTimer = null;
let busy = false;
let storageError = null;

function fmtDelta(effect){
  const labels = {slava:'Слава', krestyane:'Крестьяне', zoloto:'Золото'};
  const parts = [];
  for(const k in effect){
    if(!effect[k]) continue;
    const v = effect[k];
    parts.push(`<span class="effect-line ${v>0?'pos':'neg'}">${v>0?'+':''}${v} ${labels[k]}</span>`);
  }
  return parts.join(' &nbsp; ');
}

function applyEffect(res, effect){
  const out = {...res};
  for(const k in effect){ out[k] = (out[k]||0) + effect[k]; }
  return out;
}

function ensureRod(name){
  if(!state.rods[name]){
    state.rods[name] = {
      resources: defaultResources(),
      answers: {},
      votes: {},
      order: Object.keys(state.rods).length
    };
  }
}

function errorBanner(){
  if(!storageError) return '';
  return `<div class="ui" style="background:#F0DCC9;color:#6E2018;border:1px solid #8C2A20;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:13px;">${storageError}</div>`;
}

async function render(){
  const app = document.getElementById('app');
  if(!state){ app.innerHTML = '<div class="ui" style="color:#eee;text-align:center;padding:40px;">Загрузка...</div>'; return; }

  const banner = errorBanner();
  if(!role){
    app.innerHTML = banner + landingScreen();
    bindLanding();
    return;
  }
  if(role === 'rod' && !currentRod){
    app.innerHTML = banner + rodJoinScreen();
    bindRodJoin();
    return;
  }
  if(role === 'rod'){
    app.innerHTML = banner + rodScreen();
    bindRodScreen();
    return;
  }
  if(role === 'gm'){
    app.innerHTML = banner + gmScreen();
    bindGmScreen();
  }
}

function landingScreen(){
  return `
  <div class="center-screen">
    <div class="landing-card">
      <div class="crest">Б</div>
      <h1 class="title">Бунташный век</h1>
      <p class="subtitle">Ролевая игра для родов. Прототип каркаса.</p>
      <button class="role-btn" id="btn-gm">Я — ведущий</button>
      <button class="role-btn secondary" id="btn-rod">Я — род</button>
    </div>
  </div>`;
}
function bindLanding(){
  document.getElementById('btn-gm').onclick = ()=>{ role='gm'; render(); };
  document.getElementById('btn-rod').onclick = ()=>{ role='rod'; render(); };
}

function rodJoinScreen(){
  const existing = Object.keys(state.rods);
  return `
  <div class="center-screen">
    <div class="landing-card">
      <div class="crest">Р</div>
      <h1 class="title" style="font-size:22px;">Назовите свой род</h1>
      <p class="subtitle">Впишите название или выберите уже созданный род</p>
      <input type="text" id="rod-name-input" placeholder="Например: Волковы">
      <button class="role-btn" id="btn-join">Войти в игру</button>
      ${existing.length ? `<div class="chip-row" id="chip-row">${existing.map(n=>`<button class="chip" data-name="${n}">${n}</button>`).join('')}</div>` : ''}
      <div class="top-link" id="btn-back-landing" style="margin-top:14px;">← назад</div>
    </div>
  </div>`;
}
function bindRodJoin(){
  document.getElementById('btn-join').onclick = async ()=>{
    const val = document.getElementById('rod-name-input').value.trim();
    if(!val) return;
    ensureRod(val);
    await saveState(state);
    currentRod = val;
    render();
  };
  const chipRow = document.getElementById('chip-row');
  if(chipRow){
    chipRow.querySelectorAll('.chip').forEach(btn=>{
      btn.onclick = ()=>{ currentRod = btn.dataset.name; render(); };
    });
  }
  document.getElementById('btn-back-landing').onclick = ()=>{ role=null; render(); };
}

function rodScreen(){
  const rod = state.rods[currentRod];
  const ev = state.events[state.currentIndex];
  const res = rod.resources;

  let body = '';
  if(ev.type === 'normal'){
    const answered = rod.answers[ev.id];
    if(!answered){
      body = `
        <div class="event-card">
          <span class="era-badge">${ev.era}</span><span class="type-badge normal">Обычное событие</span>
          <h2 class="event-title">${ev.title}</h2>
          <p class="event-desc">${ev.description}</p>
          ${ev.choices.map(c=>`<button class="choice-btn" data-key="${c.key}">${c.label}</button>`).join('')}
        </div>`;
    } else {
      const choice = ev.choices.find(c=>c.key===answered.choiceKey);
      body = `
        <div class="event-card">
          <span class="era-badge">${ev.era}</span><span class="type-badge normal">Обычное событие</span>
          <h2 class="event-title">${ev.title}</h2>
          <p class="event-desc" style="opacity:0.75">Ваш выбор: ${choice ? choice.label : ''}</p>
          <div class="outcome-box">
            <div class="otitle">${choice.outcomeTitle}</div>
            <div class="otext">${choice.outcomeText}</div>
            ${fmtDelta(choice.effect)}
          </div>
        </div>`;
    }
  } else {
    const voted = rod.votes[ev.id];
    const revealed = ev.revealResult;
    if(revealed){
      const out = ev.outcomes[revealed.majorityKey];
      const wasMajority = voted === revealed.majorityKey;
      let personalEffect = {...out.allEffect};
      if(wasMajority){ for(const k in out.majorityVoterEffect){ personalEffect[k] = (personalEffect[k]||0) + out.majorityVoterEffect[k]; } }
      body = `
        <div class="event-card">
          <span class="era-badge">${ev.era}</span><span class="type-badge global">Глобальное событие</span>
          <h2 class="event-title">${ev.title}</h2>
          <p class="event-desc" style="opacity:0.75">Ваш голос: ${ev.choices.find(c=>c.key===voted)?.label || '—'}</p>
          <div class="outcome-box">
            <div class="otitle">Итоги Земского собора</div>
            <div class="otext">${out.narrative}</div>
            ${fmtDelta(personalEffect)}
          </div>
        </div>`;
    } else if(voted){
      body = `
        <div class="event-card">
          <span class="era-badge">${ev.era}</span><span class="type-badge global">Глобальное событие</span>
          <h2 class="event-title">${ev.title}</h2>
          <p class="event-desc">${ev.description}</p>
          <div class="waiting-box">Голос принят: «${ev.choices.find(c=>c.key===voted)?.label}».<br>Итоги будут оглашены после Земского собора.</div>
        </div>`;
    } else {
      body = `
        <div class="event-card">
          <span class="era-badge">${ev.era}</span><span class="type-badge global">Глобальное событие</span>
          <h2 class="event-title">${ev.title}</h2>
          <p class="event-desc">${ev.description}</p>
          ${ev.choices.map(c=>`<button class="choice-btn" data-vote-key="${c.key}">${c.label}</button>`).join('')}
        </div>`;
    }
  }

  return `
    <div class="rod-header">
      <span class="name">Род «${currentRod}»</span>
      <button id="btn-leave">сменить род</button>
    </div>
    <div class="resource-bar">
      <div class="res-pill"><div class="val">${res.slava}</div><div class="lab">Слава</div></div>
      <div class="res-pill"><div class="val">${res.krestyane}</div><div class="lab">Крестьяне</div></div>
      <div class="res-pill"><div class="val">${res.zoloto}</div><div class="lab">Золото</div></div>
    </div>
    ${body}
  `;
}
function bindRodScreen(){
  document.getElementById('btn-leave').onclick = ()=>{ currentRod=null; render(); };
  document.querySelectorAll('[data-key]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(busy) return;
      busy = true;
      const ev = state.events[state.currentIndex];
      const choice = ev.choices.find(c=>c.key===btn.dataset.key);
      const rod = state.rods[currentRod];
      rod.answers[ev.id] = {choiceKey: choice.key};
      rod.resources = applyEffect(rod.resources, choice.effect);
      render();
      await saveState(state);
      busy = false;
    };
  });
  document.querySelectorAll('[data-vote-key]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(busy) return;
      busy = true;
      const ev = state.events[state.currentIndex];
      const rod = state.rods[currentRod];
      rod.votes[ev.id] = btn.dataset.voteKey;
      render();
      await saveState(state);
      busy = false;
    };
  });
}

function gmScreen(){
  const ev = state.events[state.currentIndex];
  const rodNames = Object.keys(state.rods).sort((a,b)=> state.rods[a].order - state.rods[b].order);

  const summaryRows = rodNames.map(name=>{
    const r = state.rods[name];
    return `<tr class="rod-row" data-rod="${name}">
      <td>${name}</td><td>${r.resources.slava}</td><td>${r.resources.krestyane}</td><td>${r.resources.zoloto}</td>
    </tr>`;
  }).join('');

  let rightPanel = '';
  if(ev.type === 'normal'){
    const answeredCount = rodNames.filter(n=>state.rods[n].answers[ev.id]).length;
    rightPanel = `
      <span class="era-badge">${ev.era}</span><span class="type-badge normal">Обычное</span>
      <h2 class="event-title">${ev.title}</h2>
      <p class="event-desc">${ev.description}</p>
      <p class="ui" style="font-size:13px;color:var(--ink-soft);">Ответили: ${answeredCount} из ${rodNames.length} родов</p>
    `;
  } else {
    const votes = ev.revealResult ? null : rodNames.map(n=>({name:n, key: state.rods[n].votes[ev.id]}));
    const tally = {};
    ev.choices.forEach(c=>tally[c.key]=0);
    rodNames.forEach(n=>{ const v = state.rods[n].votes[ev.id]; if(v) tally[v]++; });
    const notVoted = rodNames.filter(n=>!state.rods[n].votes[ev.id]);

    rightPanel = `
      <span class="era-badge">${ev.era}</span><span class="type-badge global">Глобальное</span>
      <h2 class="event-title">${ev.title}</h2>
      <p class="event-desc">${ev.description}</p>
      <div class="vote-tally">
        ${ev.choices.map(c=>`<div class="vote-row"><span>${c.label}</span><span>${tally[c.key]}</span></div>`).join('')}
      </div>
      ${notVoted.length ? `<p class="small-note">Ещё не проголосовали: ${notVoted.join(', ')}</p>` : `<p class="small-note">Все рода проголосовали.</p>`}
      ${ev.revealResult
        ? `<div class="revealed-note">Итоги оглашены: победил вариант «${ev.choices.find(c=>c.key===ev.revealResult.majorityKey)?.label}».<br>${ev.outcomes[ev.revealResult.majorityKey].narrative}</div>`
        : `<button class="reveal-btn" id="btn-reveal">Огласить итоги (после Земского собора)</button>`
      }
    `;
  }

  return `
    <div class="rod-header">
      <span class="name">Панель ведущего</span>
      <button id="btn-leave-gm">выйти</button>
    </div>
    <div class="gm-grid">
      <div class="gm-panel">
        <div class="gm-nav">
          <button id="btn-prev" ${state.currentIndex===0?'disabled':''}>← пред.</button>
          <span class="pos ui">Событие ${state.currentIndex+1} / ${state.events.length}</span>
          <button id="btn-next" ${state.currentIndex===state.events.length-1?'disabled':''}>след. →</button>
        </div>
        <table class="summary">
          <tr><th>Род</th><th>Слава</th><th>Крест.</th><th>Золото</th></tr>
          ${summaryRows || '<tr><td colspan="4" style="color:var(--ink-soft);padding:10px 0;">Ещё никто не присоединился</td></tr>'}
        </table>
        <div id="history-slot"></div>
        <button class="reveal-btn" style="background:var(--seal);margin-top:16px;" id="btn-reset">Сбросить игру</button>
      </div>
      <div class="gm-panel">${rightPanel}</div>
    </div>
  `;
}
function bindGmScreen(){
  document.getElementById('btn-leave-gm').onclick = ()=>{ role=null; render(); };
  document.getElementById('btn-prev').onclick = async ()=>{
    if(busy || state.currentIndex<=0) return;
    busy = true;
    state.currentIndex--; render(); await saveState(state); busy = false;
  };
  document.getElementById('btn-next').onclick = async ()=>{
    if(busy || state.currentIndex>=state.events.length-1) return;
    busy = true;
    state.currentIndex++; render(); await saveState(state); busy = false;
  };
  const revealBtn = document.getElementById('btn-reveal');
  if(revealBtn){
    revealBtn.onclick = async ()=>{
      if(busy) return;
      busy = true;
      const ev = state.events[state.currentIndex];
      const rodNames = Object.keys(state.rods);
      const tally = {};
      ev.choices.forEach(c=>tally[c.key]=0);
      rodNames.forEach(n=>{ const v = state.rods[n].votes[ev.id]; if(v) tally[v]++; });
      let majorityKey = ev.choices[0].key;
      let max = -1;
      ev.choices.forEach(c=>{ if(tally[c.key] > max){ max = tally[c.key]; majorityKey = c.key; } });
      ev.revealResult = {majorityKey};
      const out = ev.outcomes[majorityKey];
      rodNames.forEach(n=>{
        const rod = state.rods[n];
        rod.resources = applyEffect(rod.resources, out.allEffect);
        if(rod.votes[ev.id] === majorityKey){
          rod.resources = applyEffect(rod.resources, out.majorityVoterEffect);
        }
      });
      render();
      await saveState(state);
      busy = false;
    };
  }
  document.getElementById('btn-reset').onclick = async ()=>{
    if(!confirm('Сбросить всю игру и ресурсы всех родов?')) return;
    busy = true;
    state = initialState();
    render();
    await saveState(state);
    busy = false;
  };
  document.querySelectorAll('.rod-row').forEach(row=>{
    row.onclick = ()=>{
      const name = row.dataset.rod;
      const slot = document.getElementById('history-slot');
      const rod = state.rods[name];
      const items = state.events.map(ev=>{
        if(ev.type==='normal'){
          const a = rod.answers[ev.id];
          if(!a) return `<div class="history-item"><span class="h-event">${ev.title}</span> — <span class="h-status">ещё не выбрано</span></div>`;
          const choice = ev.choices.find(c=>c.key===a.choiceKey);
          return `<div class="history-item"><span class="h-event">${ev.title}</span>: <span class="h-choice">${choice.label}</span></div>`;
        } else {
          const v = rod.votes[ev.id];
          if(!v) return `<div class="history-item"><span class="h-event">${ev.title}</span> — <span class="h-status">ещё не голосовал</span></div>`;
          const choice = ev.choices.find(c=>c.key===v);
          const status = ev.revealResult ? '(итоги оглашены)' : '(ждёт Земского собора)';
          return `<div class="history-item"><span class="h-event">${ev.title}</span>: <span class="h-choice">${choice.label}</span> <span class="h-status">${status}</span></div>`;
        }
      }).join('');
      slot.innerHTML = `<div class="history-panel"><strong style="display:block;margin-bottom:6px;">История рода «${name}»</strong>${items}</div>`;
    };
  });
}

async function boot(){
  state = await loadState();
  render();
  pollTimer = setInterval(async ()=>{
    if(busy) return;
    const fresh = await loadState();
    state = fresh;
    render();
  }, 4000);
}
boot();
</script>
</body>
</html>
